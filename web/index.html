<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your game collection, discover new releases and what's coming soon, and build your personal games list.">
  <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Picklog">
  <meta property="og:title" content="Picklog">
  <meta property="og:description" content="Track your game collection, discover new releases, and build your personal games list.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Picklog">
  <meta name="twitter:description" content="Track your game collection, discover new releases, and build your personal games list.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Picklog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Picklog</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading splash in the Pickforge tokens; follows the system theme like
       the app's default System theme mode. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0A0A0B;
      color: #F2F2F3;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    #loading .mark { width: 72px; height: 72px; }
    #loading .bar {
      width: 96px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #FF7A1A;
      animation: pf-load 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes pf-load {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-color-scheme: light) {
      #loading { background: #FAFAF7; color: #17171A; }
      #loading .bar { background: rgba(0, 0, 0, 0.1); }
      #loading .bar::after { background: #E5610A; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .bar::after { animation: none; transform: translateX(75%); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Picklog">
    <svg class="mark" viewBox="0 0 128 128" fill="none" aria-hidden="true">
      <rect width="128" height="128" rx="24" fill="#0A0A0B"/>
      <g stroke="#F2F2F3" stroke-width="3" stroke-linecap="square" fill="none">
        <path d="M30 48 V32 H46"/><path d="M30 80 V96 H46"/><path d="M82 96 H98 V80"/>
        <path d="M47 51 H79"/><path d="M47 61 H71"/><path d="M48 73 L55 80 L69 66"/>
      </g>
      <circle cx="90" cy="40" r="7" fill="#FF7A1A"/>
      <g stroke="#F2F2F3" stroke-width="1" stroke-dasharray="2 3" opacity="0.35">
        <line x1="30" y1="48" x2="30" y2="80"/><line x1="46" y1="32" x2="82" y2="32"/>
        <line x1="46" y1="96" x2="82" y2="96"/><line x1="98" y1="48" x2="98" y2="80"/>
      </g>
    </svg>
    <div>Picklog</div>
    <div class="bar"></div>
  </div>
  <!-- Renderer (CanvasKit) and CanvasKit source are pinned in web/flutter_bootstrap.js. -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the loading splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
